<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="charactercard.css">
    <script type="module" src="charactercard.js" defer></script>
</head>
<body>
<main>
    <div class="character-card">
        <img class="character-image" src="images/sam-altman.webp" alt="ram altman">
        <h2 class="character-name">Sam Altman</h2>
        <p class="character-class"></p>
        <p class="Level"></p>
        <p class="HP"></p>
        <section class="buttons">
            <button class="attack-button">Attacked</button>
            <button class="level-button">Level Up</button>
        </section>
    </div>
</main>
</body>
</html>
