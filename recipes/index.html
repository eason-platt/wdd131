<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="icon" href="images/recipe-book.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <title>RecipeBook</title>
    <link rel="stylesheet" href="recipes.css"/>
</head>
<body>
<main>
    <header>
        <img class="logo" src="images/recipe-book.png" alt="recipe-book">
        <h1>RecipeBook</h1>
    </header>
    <section class="searchbar">
        <label for="searchbar"></label>
        <input id="searchbar" type="text" name="searchbar" placeholder="Find a recipe">
        <img class="search-icon" src="images/search.svg" alt="search-icon">
    </section>
    <hr>
    <section class="recipe-container">
        <div class="recipe-image">
            <img src="images/apple-crisp.jpg" alt="Apple Crisp">
        </div>
        <section class="recipe-details">
            <div class="recipe-type">
                <p>dessert</p>
            </div>
            <h2>Apple Crisp</h2>
            <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
            <p class="recipe-description">This apple crisp recipe is a simple yet delicious fall dessert that's great
                served warm with vanilla ice cream.</p>
        </section>
    </section>
    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>
    </footer>
</main>
</body>
</html>
